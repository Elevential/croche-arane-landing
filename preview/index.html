<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Preview Arane</title>
    <script>
      (function () {
        var target = "/index.html?mode=preview";
        // Live Server às vezes serve sem index.html na URL
        try {
          location.replace(target);
        } catch (e) {
          location.href = target;
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/index.html?mode=preview" />
  </head>
  <body style="font-family: sans-serif; padding: 2rem; text-align: center;">
    <p>Abrindo modo revisão…</p>
    <p><a href="/index.html?mode=preview">Se não abrir, clique aqui</a></p>
  </body>
</html>
